<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Music</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f3d3e;--ink:#fff8e7;--soft:#9fc9c3;--panel:#14504f;--c1:#ff7a59;--c2:#ffd23f;--c3:#6fe3b5;--c4:#b9a2ff;--c5:#5cc8ff;--dark:#0b2c2d}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Baloo 2",system-ui,"Trebuchet MS",sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);-webkit-user-select:none;user-select:none}
button{font:inherit;cursor:pointer;border:0;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--c2);outline-offset:2px}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px}
h1{margin:0;font-size:2rem;font-weight:800}
.lock{background:transparent;opacity:.45;font-size:1.3rem;padding:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px;padding:8px 18px 28px;max-width:900px;margin:0 auto}
.tile{aspect-ratio:1;border-radius:28px;color:var(--dark);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:12px;font-weight:800;font-size:1.15rem;line-height:1.1;text-align:center;transition:transform .12s}
.tile:active{transform:scale(.94)}
.tile .e{font-size:3.2rem}
.empty{max-width:420px;margin:12vh auto;text-align:center;padding:0 24px;font-size:1.2rem;color:var(--soft)}
#player{display:none;flex-direction:column;height:100%}
#player.on{display:flex}
.bar{display:flex;align-items:center;gap:12px;padding:12px 16px}
.back{background:var(--c2);color:var(--dark);font-weight:800;font-size:1.1rem;border-radius:999px;padding:8px 20px}
.bar span{font-weight:800;font-size:1.2rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
iframe{flex:1;width:100%;border:0;background:#000;min-height:0}
dialog{border:0;border-radius:24px;background:var(--panel);color:var(--ink);padding:22px;width:min(92vw,460px);max-height:90vh;overflow:auto;font-family:inherit}
dialog::backdrop{background:rgba(0,0,0,.6)}
h2{margin:0 0 12px;font-size:1.4rem}
label{display:block;margin:10px 0 4px;color:var(--soft);font-size:.95rem}
input{width:100%;font:inherit;font-size:1rem;padding:10px 12px;border-radius:12px;border:2px solid transparent;background:var(--dark);color:var(--ink);-webkit-user-select:text;user-select:text}
.row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn{background:var(--c3);color:var(--dark);font-weight:800;border-radius:12px;padding:9px 16px}
.btn.alt{background:transparent;border:2px solid var(--soft);color:var(--ink)}
.btn.del{background:var(--c1)}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.12)}
.item small{display:block;color:var(--soft);word-break:break-all}
.msg{color:var(--c2);min-height:1.3em;margin:8px 0 0}
@media (prefers-reduced-motion:reduce){.tile{transition:none}}
</style>
</head>
<body>
<main id="home">
  <header><h1>My Music</h1><button class="lock" id="lockBtn" aria-label="Parent area">🔒</button></header>
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" hidden>No playlists yet. A grown-up can add some with the lock button.</p>
</main>

<section id="player" aria-label="Player">
  <div class="bar"><button class="back" id="backBtn">‹ Back</button><span id="ptitle"></span></div>
  <iframe id="frame" title="Playlist player" sandbox="allow-scripts allow-same-origin allow-presentation" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>
</section>

<dialog id="dlg"><div id="dlgBody"></div></dialog>

<script>
(function(){
  var KEY="kidmusic.v1";
  var COLORS=["--c1","--c2","--c3","--c4","--c5"];
  var EMOJI=["🎵","🎸","🥁","🎹","🎤","🎧","🚀","🦄","🐸","🌈"];
  var memory={playlists:[],pin:""};
  var $=function(id){return document.getElementById(id)};

  function load(){try{var r=localStorage.getItem(KEY);if(r){var d=JSON.parse(r);if(d&&Array.isArray(d.playlists))memory=d}}catch(e){}}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(memory))}catch(e){}}

  function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}
  function parseId(v){
    v=(v||"").trim();
    var m=v.match(/[?&]list=([A-Za-z0-9_-]+)/);
    if(m)return m[1];
    return /^[A-Za-z0-9_-]{10,}$/.test(v)?v:null;
  }

  function render(){
    var g=$("grid");g.innerHTML="";
    $("empty").hidden=memory.playlists.length>0;
    memory.playlists.forEach(function(p,i){
      var b=document.createElement("button");
      b.className="tile";
      b.style.background="var("+COLORS[i%COLORS.length]+")";
      b.innerHTML='<span class="e">'+EMOJI[i%EMOJI.length]+'</span><span>'+esc(p.name)+'</span>';
      b.onclick=function(){play(p)};
      g.appendChild(b);
    });
  }

  function play(p){
    $("ptitle").textContent=p.name;
    $("frame").src="https://www.youtube-nocookie.com/embed/videoseries?list="+encodeURIComponent(p.id)+"&autoplay=1&rel=0&playsinline=1&iv_load_policy=3";
    $("home").style.display="none";
    $("player").classList.add("on");
  }
  function stop(){
    $("frame").src="about:blank";
    $("player").classList.remove("on");
    $("home").style.display="";
  }
  $("backBtn").onclick=stop;

  var dlg=$("dlg"),body=$("dlgBody");
  function open(html){body.innerHTML=html;if(!dlg.open)dlg.showModal()}
  function close(){dlg.close()}

  function askPin(){
    var first=!memory.pin;
    open('<h2>'+(first?'Set a parent PIN':'Parent PIN')+'</h2>'
      +'<label for="pin">'+(first?'Choose 4 or more digits':'Enter your PIN')+'</label>'
      +'<input id="pin" type="password" inputmode="numeric" autocomplete="off">'
      +'<p class="msg" id="msg"></p>'
      +'<div class="row"><button class="btn" id="ok">OK</button><button class="btn alt" id="no">Cancel</button></div>');
    $("no").onclick=close;
    $("ok").onclick=function(){
      var v=$("pin").value.trim();
      if(first){
        if(!/^\d{4,}$/.test(v)){$("msg").textContent="Use at least 4 digits.";return}
        memory.pin=v;save();manage();
      }else if(v===memory.pin){manage()}
      else{$("msg").textContent="Wrong PIN.";$("pin").value=""}
    };
    $("pin").focus();
  }

  function manage(note){
    var items=memory.playlists.map(function(p,i){
      return '<div class="item"><div><strong>'+esc(p.name)+'</strong><small>'+esc(p.id)+'</small></div><button class="btn del" data-i="'+i+'">Remove</button></div>';
    }).join("")||'<p class="msg">No playlists yet.</p>';
    open('<h2>Parent area</h2>'+items
      +'<h2 style="margin-top:20px">Add a playlist</h2>'
      +'<label for="pn">Name your kid will see</label><input id="pn" maxlength="30">'
      +'<label for="pu">YouTube Music playlist link</label><input id="pu" placeholder="https://music.youtube.com/playlist?list=...">'
      +'<p class="msg" id="msg">'+(note||'')+'</p>'
      +'<div class="row"><button class="btn" id="add">Add playlist</button><button class="btn alt" id="chg">Change PIN</button><button class="btn alt" id="done">Done</button></div>');
    Array.prototype.forEach.call(body.querySelectorAll("[data-i]"),function(b){
      b.onclick=function(){memory.playlists.splice(+b.dataset.i,1);save();render();manage("Removed.")};
    });
    $("add").onclick=function(){
      var name=$("pn").value.trim(),id=parseId($("pu").value);
      if(!name){$("msg").textContent="Give it a name.";return}
      if(!id){$("msg").textContent="That link has no playlist ID. Copy the full playlist link.";return}
      memory.playlists.push({name:name,id:id});save();render();manage("Added “"+name+"”.");
    };
    $("chg").onclick=function(){memory.pin="";save();askPin()};
    $("done").onclick=close;
  }

  $("lockBtn").onclick=askPin;
  load();render();
})();
</script>
</body>
</html>
